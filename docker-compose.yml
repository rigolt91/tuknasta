services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tuknasta-app
    container_name: tuknasta-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: tuknasta
      DB_USERNAME: root
      DB_PASSWORD: ""
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      - db
      - mailpit

  web:
    image: nginx:stable-alpine
    container_name: tuknasta-web
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - app
    volumes:
      - ./:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: mysql:8.0
    container_name: tuknasta-db
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: tuknasta
      MYSQL_ROOT_PASSWORD: ""
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"

  mailpit:
    image: axllent/mailpit
    container_name: tuknasta-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  node:
    image: node:18
    container_name: tuknasta-node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    command: ["tail", "-f", "/dev/null"]

volumes:
  dbdata:
  vendor:
  node_modules:
